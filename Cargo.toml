[package]
name = "wallace"
version = "0.1.0"
edition = "2024"
description = "Your personal voice assistant."
authors = ["Logan-010"]

[dependencies]
clap = { version = "4.6.7", features = ["env", "derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
moonshine-rs = { version = "0.2.9", default-features = false }
reqwest = "0.13.5"
serde_json = "1.0.154"
silero-vad-crs = { version = "0.4.0", features = ["auto"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false
